name: C18 offline extension and delivery contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Run only fictional offline contracts
        shell: pwsh
        run: python -B -X utf8 scripts/c18_verify.py --output "$env:RUNNER_TEMP/c18-verification"
      # This job deliberately has no provider credentials, npm install hooks,
      # packaging, installer execution, signing, automatic upload or publication.
